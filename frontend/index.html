<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Module 324 Starter Application</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="hero-panel">
          <span class="badge" id="theme-badge">Starter</span>
          <h1 id="app-title">Starter Application</h1>
          <p id="app-subtitle">A small frontend and backend application for Module 324.</p>
        </div>
        <div class="status-card">
          <strong id="summary">Loading summary...</strong>
          <p id="status">Loading application data...</p>
        </div>
      </section>

      <section class="layout">
        <form class="form-panel" id="item-form">
          <h2>Add or edit item</h2>
          <div id="form-fields"></div>
          <div class="form-actions">
            <button id="submit-button" type="submit">Create</button>
            <button id="reset-button" type="button" class="secondary" hidden>Cancel edit</button>
          </div>
        </form>

        <section class="list-panel">
          <h2>Current data</h2>
          <div class="cards" id="cards"></div>
        </section>
      </section>
    </main>
  </body>
</html>
