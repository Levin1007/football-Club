services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: football-club-manager-backend
    environment:
      APP_NAME: "Football Club Manager"
      APP_VERSION: "${APP_VERSION:-0.2.0}"
      APP_PORT: "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: football-club-manager-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  jenkins:
    build:
      context: jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home: